---
 - match: \.so$
   proc:
    - context:
         source_dir: <%= File.join(target.source.root, dir) %>
         target_dir: <%= target.dldir %>
         target_prefix: <%= File.expand_path(config.install_prefix) %>
         file: <%= file %>
      actor: copy
    - context:
         source_dir: <%= target.dldir %>
         target_dir: <%= File.join(target.require_fulllibdir) %>
         target_prefix: <%= File.expand_path(config.install_prefix) %>
         file: <%= file %>
      actor: link
 - match: \.build_complete$
   proc:
    - context:
         target_dir: <%= target.dldir %>
         target_prefix: <%= File.expand_path(config.install_prefix) %>
         file: <%= 'gem.build_complete' %>
      actor: touch
 - match: rubygems_plugin\.(so|rb)
   proc:
    - context:
         target_dir: <%= target.plugindir %>
         target_prefix: <%= File.expand_path(config.install_prefix) %>
         file: <%= "#{target.source.name}_plugin.rb" %>
         body: "require_relative '../gems/<%= target.source.name %>-<%= target.source.version %>/<%= target.require_libdir %>/<%= file %>'"
         if: "/^lib/.match?('<%= target.require_libdir %>')"
      actor: gen
